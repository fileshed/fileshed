name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ '24', '26' ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  types:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ '24', '26' ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint:types

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ '24', '26' ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test

  # Postgres is the primary target, and the unit lane above proves only SQLite. Every server spec runs again here
  # against a real server: the harness creates a uniquely-named database per boot and drops it afterwards, so this
  # needs nothing beyond a reachable admin connection.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fileshed
          POSTGRES_PASSWORD: fileshed
          POSTGRES_DB: fileshed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fileshed -d fileshed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run test:server
        env:
          FILESHED_TEST_DATABASE_URL: postgres://fileshed:fileshed@localhost:5432/fileshed

  # No services or secrets on purpose: the harness spawns its own server children on OS-assigned ports over temp
  # SQLite and blob directories, and config/config.yaml carries a fallback for every key it needs.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ '24', '26' ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  # amd64 only and no push: this lane proves the image builds and boots. The layer cache it fills is what the
  # publish job below reuses, so the multi-arch build only pays for the arm64 runtime stage.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: fileshed:ci
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No AUTH_SECRET on purpose: an appliance install hands the image nothing, so the smoke run boots the way one
      # does -- the server generates its own key at /data/auth-secret, or this job fails.
      - name: Boot the image
        run: |
          docker run -d --name fileshed-smoke -p 3000:3000 \
            -e BASE_URL=http://localhost:3000 \
            fileshed:ci

          for _ in $(seq 60); do
            if curl -fsS http://localhost:3000/api/health | grep -q '"status":"ok"'; then
              echo "Server answered /api/health."
              curl -fsS -o /dev/null http://localhost:3000/
              echo "Client served from /."

              mode=$(docker exec fileshed-smoke stat -c '%a' /data/auth-secret)
              if [ "$mode" != "600" ]; then
                echo "Session secret file has mode $mode, expected 600."
                exit 1
              fi
              echo "Session secret generated at /data/auth-secret (mode $mode)."
              exit 0
            fi
            if [ "$(docker inspect -f '{{ .State.Running }}' fileshed-smoke)" != "true" ]; then
              echo "Container exited before it became reachable."
              docker logs fileshed-smoke
              exit 1
            fi
            sleep 2
          done

          echo "Timed out waiting for /api/health."
          docker logs fileshed-smoke
          exit 1

      - name: Remove the container
        if: always()
        run: docker rm -f fileshed-smoke

  # `dev` means "the newest main commit that passed everything", so this waits on every check above.
  docker-dev:
    needs: [ lint, types, unit, postgres, e2e, docker ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fileshed/fileshed
          tags: type=raw,value=dev
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
