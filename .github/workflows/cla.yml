name: "CLA Assistant"

on:
  issue_comment:
    types: [ created ]
  pull_request_target:
    types: [ opened, closed, synchronize ]

# Explicit, in case the repository's default GITHUB_TOKEN workflow permissions are read-only.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/fileshed/fileshed/blob/main/.github/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          # Signatures live off main on a branch that must stay unprotected; the action commits to it directly.
          branch: 'cla-signatures'
          allowlist: morgul,dependabot[bot],*[bot]
