name: Docker Release

# scripts/release.sh tags v<version> and creates the GitHub release, marking any hyphenated version a prerelease.
# The version tag is always published; `beta` or `latest` moves onto it depending on which kind of release this is.

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` rides the default latest=auto flavor, which skips prerelease versions on its own.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fileshed/fileshed
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=beta,enable=${{ github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
