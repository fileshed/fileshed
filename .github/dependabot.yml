version: 2

updates:
  # Grouped on purpose. Fourteen separate pull requests a week is how an update schedule gets ignored, and the
  # transitive churn that produced this file was every fix already sitting inside an existing caret range.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [ minor, patch ]
      development:
        dependency-type: development
        update-types: [ minor, patch ]
    ignore:
      # marked moves with @tiptap/markdown's major, not on its own: lineModel.ts hands tiptap a marked instance.
      - dependency-name: marked
        update-types: [ version-update:semver-major ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ '*' ]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
