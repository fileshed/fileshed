# ---------------------------------------------------------------------------------------------------------------------
# FileShed — SQLite deployment: one container, one volume. For Postgres, use compose.postgres.yaml instead.
# ---------------------------------------------------------------------------------------------------------------------

services:
  fileshed:
    build: .
    # image: <registry>/fileshed:latest   # once published, use the image instead of building locally
    ports:
      - "3000:3000"
    environment:
      # Optional: left empty, the server generates a session key at /data/auth-secret on first run. To hold it
      # yourself, put it in a .env file next to this compose file (AUTH_SECRET=...) or export it in your shell —
      # `openssl rand -base64 32` mints one. Changing it signs everyone out. See docs/secrets.md.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # The externally reachable URL (scheme + host + port). Behind a reverse proxy, this is the public URL.
      BASE_URL: http://localhost:3000
      # First run: the console log prints a one-time setup code — finish setup in the browser at /setup.
      # For non-interactive provisioning, set FILESHED_SETUP_TOKEN and POST /api/setup instead.
      # FILESHED_SETUP_TOKEN: choose-a-setup-token
    volumes:
      - fileshed-data:/data
    restart: unless-stopped

volumes:
  fileshed-data:

# ---------------------------------------------------------------------------------------------------------------------
