# ---------------------------------------------------------------------------------------------------------------------
# FileShed configuration defaults.
#
# This committed file IS the defaults. Values use ${VAR} / ${VAR:-fallback} substitution against the process
# environment at boot: set an environment variable at deployment and it flows in here; otherwise the fallback after
# `:-` applies. An empty result reads as unset (exactly like an absent environment variable). Admin-set overrides in
# the database sit ABOVE everything here; "reset to default" in the admin UI returns to this file's substituted
# value. Point FILESHED_CONFIG at another file to replace this one wholesale.
# ---------------------------------------------------------------------------------------------------------------------

# Bind address and port.
HOST: ${HOST:-0.0.0.0}
PORT: ${PORT:-3950}

# Database: sqlite (default) or postgres. DATABASE_URL is required for postgres.
DATABASE_KIND: ${DATABASE_KIND:-sqlite}
DATABASE_PATH: ${DATABASE_PATH:-./data/fileshed.db}
DATABASE_URL: ${DATABASE_URL:-}

# Session signing, in precedence order (docs/secrets.md has the whole story):
#   AUTH_SECRET_FILE -- a file you point at, anywhere but the managed path below. Read, never written; a missing
#                       one fails the boot.
#   AUTH_SECRET      -- the value itself.
#   the managed file -- beside the database, whether AUTH_SECRET_FILE names it or nothing does. Generated on first
#                       run. This is what the container image uses.
# Setting one of the first two migrates the settings sealed under the managed file and then removes it.
AUTH_SECRET: ${AUTH_SECRET:-}
AUTH_SECRET_FILE: ${AUTH_SECRET_FILE:-}

# The key an earlier AUTH_SECRET used. Set it for the one boot after a rotation and stored secrets move to the new
# key; remove it afterwards.
AUTH_SECRET_PREVIOUS: ${AUTH_SECRET_PREVIOUS:-}

# Clear stored secrets no available key can open, instead of refusing to boot. The only thing that makes FileShed
# delete one; set it for a single boot and remove it again.
FILESHED_DISCARD_SEALED_SECRETS: ${FILESHED_DISCARD_SEALED_SECRETS:-false}

# The externally reachable URL (behind a reverse proxy, the public one).
BASE_URL: ${BASE_URL:-http://localhost:5173}

# Further origins the instance answers on, comma-separated, for one reachable at more than one URL. BASE_URL is
# answered on with or without this; entries are read down to scheme + host + port, and each must use BASE_URL's
# scheme. docs/deployment.md covers the provider callbacks each origin needs.
TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}

# Blob storage and maintenance.
STORAGE_ROOT: ${STORAGE_ROOT:-./data/blobs}
GC_GRACE_DAYS: ${GC_GRACE_DAYS:-7}
GC_INTERVAL_MINUTES: ${GC_INTERVAL_MINUTES:-60}
TRASH_PURGE_DAYS: ${TRASH_PURGE_DAYS:-30}

# Size caps.
UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5368709120}
AVATAR_MAX_BYTES: ${AVATAR_MAX_BYTES:-2097152}

# Bytes per upload chunk: what a fronting proxy's request-body cap actually has to accept, since no single request
# carries the whole file. Minimum 1 MiB.
UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-8388608}

# Production client serving: the built client's directory; empty leaves the server API-only (development).
CLIENT_DIST: ${CLIENT_DIST:-}

# First-run automation token (see docs/deployment.md); empty uses the boot-printed setup code.
FILESHED_SETUP_TOKEN: ${FILESHED_SETUP_TOKEN:-}

# OAuth social providers need no lines here: any provider credential set in the environment is picked up
# directly by its setting name -- e.g. GITHUB_CLIENT_ID + GITHUB_CLIENT_SECRET enables GitHub, GITLAB_* GitLab,
# and so on for every provider better-auth supports. They can also be entered at runtime from the admin
# Authentication tab. Provider changes take effect on the next restart.

# Outgoing email (password reset, verification). Unset SMTP_HOST or SMTP_FROM leaves mail off; all of these can
# also be set from the admin Email tab, where values entered there win over these.
SMTP_HOST: ${SMTP_HOST:-}
SMTP_PORT: ${SMTP_PORT:-587}
SMTP_SECURE: ${SMTP_SECURE:-false}
SMTP_USER: ${SMTP_USER:-}
SMTP_PASSWORD: ${SMTP_PASSWORD:-}
SMTP_FROM: ${SMTP_FROM:-}

# Require new accounts to verify their email before signing in. Needs working SMTP; applied at boot (a change from
# the admin UI takes effect after a restart).
EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}

# ---------------------------------------------------------------------------------------------------------------------
