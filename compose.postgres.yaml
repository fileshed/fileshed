# ---------------------------------------------------------------------------------------------------------------------
# FileShed — Postgres deployment: the app container plus a Postgres 17 service. The blob store still lives on the
# fileshed-data volume; only the database moves. Run with: docker compose -f compose.postgres.yaml up -d
# ---------------------------------------------------------------------------------------------------------------------

services:
  fileshed:
    build: .
    # image: <registry>/fileshed:latest   # once published, use the image instead of building locally
    ports:
      - "3000:3000"
    environment:
      # Optional: left empty, the server generates a session key at /data/auth-secret on first run — which pg_dump
      # does NOT carry, so back that file up with your dumps. To hold it yourself, put it in a .env file next to
      # this compose file (AUTH_SECRET=...) or export it in your shell. See docs/secrets.md.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # The externally reachable URL (scheme + host + port). Behind a reverse proxy, this is the public URL.
      BASE_URL: http://localhost:3000
      DATABASE_KIND: postgres
      DATABASE_URL: postgres://fileshed:change-me@postgres:5432/fileshed
      # First run: the console log prints a one-time setup code — finish setup in the browser at /setup.
      # For non-interactive provisioning, set FILESHED_SETUP_TOKEN and POST /api/setup instead.
      # FILESHED_SETUP_TOKEN: choose-a-setup-token
    volumes:
      - fileshed-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fileshed
      POSTGRES_USER: fileshed
      POSTGRES_PASSWORD: change-me
    volumes:
      - fileshed-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileshed -d fileshed"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  fileshed-data:
  fileshed-pg:

# ---------------------------------------------------------------------------------------------------------------------
